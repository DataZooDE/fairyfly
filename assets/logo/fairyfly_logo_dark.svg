<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Deep Obsidian Slate background -->
  <rect width="512" height="512" rx="100" fill="#0A111A" />

  <!-- Direction B: Angular Sharp-Fold Tangram on Dark (Fox/Falcon geometry style) -->
  <g id="mark" transform="translate(256, 185)">
    <!-- Pure geometric paper-fold planes with hairline negative space seams -->
    <!-- Left Wing Main Plane (Luminous DataZoo Teal) -->
    <polygon points="-6,-60 -150,-110 -115,25" fill="#25B493" />
    <!-- Left Wing Lower Fold (Deep DataZoo Teal) -->
    <polygon points="-6,-60 -115,25 -55,80" fill="#1A7C64" />
    <!-- Left Wing Base Fold (Petrol Navy Accent) -->
    <polygon points="-6,5 -55,80 -20,95" fill="#1C3144" />

    <!-- Right Wing Main Plane (Highlight Mint / Seafoam for directional fold lighting) -->
    <polygon points="6,-60 150,-110 115,25" fill="#3CD6B2" />
    <!-- Right Wing Lower Fold (Signature Teal) -->
    <polygon points="6,-60 115,25 55,80" fill="#20A884" />
    <!-- Right Wing Base Fold (Slate Blue fold) -->
    <polygon points="6,5 55,80 20,95" fill="#274259" />

    <!-- Center Spine & Minimalist Head: Negative space spine & needle body in crisp white -->
    <polygon points="0,-85 -7,-15 0,75 7,-15" fill="#FFFFFF" />
    <circle cx="0" cy="-98" r="6" fill="#FFFFFF" />
  </g>

  <!-- Typography: Lowercase "fairyfly" in crisp off-white with DataZoo teal subtitle -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', sans-serif" font-size="54" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="-1.5">fairyfly</text>
  <text x="256" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#3CD6B2" text-anchor="middle" letter-spacing="4">PRECISION AI AGENT FOR SAP</text>
</svg>