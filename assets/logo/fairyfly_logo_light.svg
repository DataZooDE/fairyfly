<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pristine light canvas with fine border -->
  <rect width="512" height="512" rx="100" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />

  <!-- Direction B: Angular Sharp-Fold Tangram (Fox/Falcon geometry style) -->
  <g id="mark" transform="translate(256, 185)">
    <!-- Pure geometric paper-fold planes with hairline negative space seams -->
    <!-- Left Wing Main Plane -->
    <polygon points="-6,-60 -150,-110 -115,25" fill="#20A884" />
    <!-- Left Wing Lower Fold -->
    <polygon points="-6,-60 -115,25 -55,80" fill="#17745B" />
    <!-- Left Wing Base Fold -->
    <polygon points="-6,5 -55,80 -20,95" fill="#1E2E3D" />

    <!-- Right Wing Main Plane (Lighting offset) -->
    <polygon points="6,-60 150,-110 115,25" fill="#26BA93" />
    <!-- Right Wing Lower Fold -->
    <polygon points="6,-60 115,25 55,80" fill="#1C8B6D" />
    <!-- Right Wing Base Fold -->
    <polygon points="6,5 55,80 20,95" fill="#293E52" />

    <!-- Center Spine & Minimalist Head: Negative space spine & needle body -->
    <polygon points="0,-85 -7,-15 0,75 7,-15" fill="#0F172A" />
    <circle cx="0" cy="-98" r="6" fill="#0F172A" />
  </g>

  <!-- Typography: Lowercase "fairyfly" with perfect kerning and high-contrast dark petrol -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', sans-serif" font-size="54" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="-1.5">fairyfly</text>
  <text x="256" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#17745B" text-anchor="middle" letter-spacing="4">PRECISION AI AGENT FOR SAP</text>
</svg>