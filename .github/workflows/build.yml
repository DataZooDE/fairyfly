name: Build fairyfly

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

env:
  VCPKG_COMMIT: 29ff5b8131d0c6c8fcb8fbaef35992f0d507cd7c

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-windows:
    # Pinned: windows-latest moved to an image without Visual Studio 2022, so the
    # "Visual Studio 17 2022" CMake generator below could not find any instance (2026-09-29).
    timeout-minutes: 40
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        git checkout ${{ env.VCPKG_COMMIT }}
        .\bootstrap-vcpkg.bat
      shell: pwsh

    - name: Cache vcpkg (comprehensive)
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg_installed
          ${{ github.workspace }}/vcpkg/packages
          ${{ github.workspace }}/vcpkg/buildtrees
          ${{ github.workspace }}/vcpkg/downloads
        key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-
          vcpkg-${{ runner.os }}-

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set VCPKG_ROOT environment variable
      run: |
        echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $env:GITHUB_ENV
        echo "VCPKG_ROOT set to: ${{ github.workspace }}/vcpkg"
      shell: pwsh

    - name: Configure and Build (Makefile-style)
      run: |
        Write-Host "Configuring CMake for Release build..."
        cmake -B build `
          -G "Visual Studio 17 2022" `
          -DVCPKG_TARGET_TRIPLET=x64-windows-static `
          -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"

        Write-Host "`nBuilding project in Release mode..."
        cmake --build build --config Release --target fairyfly unit_tests --parallel

        Write-Host "`n✓ Build complete. Executable at: build/Release/fairyfly.exe"
      shell: pwsh

    - name: Run unit tests (SAP-free tests only)
      run: |
        Write-Host "Running unit tests (excluding SAP GUI-dependent tests)..."
        # Run tests excluding [!mayfail] tagged tests
        & "build/Release/unit_tests.exe" "~[!mayfail]" --reporter junit --out build/test-results.xml

      shell: pwsh
      continue-on-error: false

    - name: Verify executable
      run: |
        if (Test-Path "build/Release/fairyfly.exe") {
          Write-Host "✓ fairyfly.exe built successfully"
          $size = (Get-Item "build/Release/fairyfly.exe").Length / 1MB
          Write-Host "  Size: $([math]::Round($size, 2)) MB"

          # Test executable runs
          Write-Host "`nTesting executable..."
          & "build/Release/fairyfly.exe" --version
          & "build/Release/fairyfly.exe" --help

          # Code signing metadata: product name = project name, product version = fairyfly --version
          $info = (Get-Item "build/Release/fairyfly.exe").VersionInfo
          $reported = (& "build/Release/fairyfly.exe" --version | Out-String).Trim()
          if ($info.ProductName -ne "fairyfly") { Write-Error "ProductName is '$($info.ProductName)', expected 'fairyfly'"; exit 1 }
          if ($info.ProductVersion -ne $reported) { Write-Error "ProductVersion '$($info.ProductVersion)' differs from --version '$reported'"; exit 1 }
          Write-Host "  Version info OK: $($info.ProductName) $($info.ProductVersion)"
        } else {
          Write-Error "fairyfly.exe not found!"
          exit 1
        }
      shell: pwsh

    - name: Per-user MSI - build, install, check, uninstall (real installer run)
      env:
        FAIRYFLY_GITHUB_TOKEN: ${{ github.token }}
      run: |
        dotnet tool install --global wix --version 5.0.2
        $msiVersion = (& ./packaging/msi_version.ps1).Trim()
        Write-Host "MSI version $msiVersion"
        wix build packaging/fairyfly.wxs -arch x64 -d ExePath=build/Release/fairyfly.exe -d TrayExePath=build/Release/fairyfly-tray.exe -d MsiVersion=$msiVersion -o build/fairyfly.msi
        if ($LASTEXITCODE -ne 0) { Write-Error "wix build failed"; exit 1 }

        $p = Start-Process msiexec.exe -ArgumentList @('/i', "$PWD\build\fairyfly.msi", '/qn', '/l*v', "$PWD\build\msi-install.log") -Wait -PassThru
        if ($p.ExitCode -ne 0) { Get-Content build/msi-install.log -Tail 50; Write-Error "install failed: $($p.ExitCode)"; exit 1 }
        $exe = Join-Path $env:LOCALAPPDATA 'Programs\fairyfly\fairyfly.exe'
        if (-not (Test-Path $exe)) { Write-Error "not installed at $exe"; exit 1 }
        $v = (& $exe --version | Out-String).Trim()
        $expected = (& build/Release/fairyfly.exe --version | Out-String).Trim()
        if ($v -ne $expected) { Write-Error "installed version '$v', expected '$expected'"; exit 1 }
        $userPath = [Environment]::GetEnvironmentVariable('PATH', 'User')
        if ($userPath -notlike "*Programs\fairyfly*") { Write-Error "user PATH not extended: $userPath"; exit 1 }
        $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\fairyfly.lnk'
        if (-not (Test-Path $lnk)) { Write-Error "Start-menu shortcut missing: $lnk"; exit 1 }
        $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
        if ($target.Arguments -ne 'link run --tray') { Write-Error "shortcut arguments '$($target.Arguments)'"; exit 1 }
        $starter = Join-Path $env:LOCALAPPDATA 'Programs\fairyfly\fairyfly-tray.exe'
        if ($target.TargetPath -ne $starter) { Write-Error "shortcut target '$($target.TargetPath)', expected $starter (no console)"; exit 1 }
        # the approval notifications: fairyfly's AppUserModelID and the toast activator on the shortcut
        $item = (New-Object -ComObject Shell.Application).Namespace((Split-Path $lnk)).ParseName((Split-Path $lnk -Leaf))
        $aumid = $item.ExtendedProperty('System.AppUserModel.ID')
        $activator = "$($item.ExtendedProperty('System.AppUserModel.ToastActivatorCLSID'))"
        Write-Host "shortcut AppUserModelID '$aumid', ToastActivatorCLSID '$activator'"
        if ($aumid -ne 'DataZoo.fairyfly') { Write-Error "shortcut AppUserModelID '$aumid', expected DataZoo.fairyfly"; exit 1 }
        if ($activator -notmatch 'DAAF1065-EF17-4CFF-B3D2-EFAF70594959') { Write-Error "shortcut ToastActivatorCLSID '$activator'"; exit 1 }

        # the Start-menu entry: no console, the tray stays up, "Start with Windows" is on, uninstall closes it
        $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
        Remove-ItemProperty $runKey -Name fairyfly-link -ErrorAction SilentlyContinue
        Remove-Item 'HKCU:\Software\DataZoo\fairyfly\tray' -Recurse -ErrorAction SilentlyContinue
        Start-Process $starter -ArgumentList $target.Arguments
        Start-Sleep -Seconds 8
        $trays = @(Get-CimInstance Win32_Process -Filter "Name='fairyfly.exe'" | Where-Object { $_.CommandLine -like '*link run --tray*' })
        if ($trays.Count -ne 1) { Write-Error "expected one link tray, found $($trays.Count)"; exit 1 }
        $conhosts = @(Get-CimInstance Win32_Process -Filter "Name='conhost.exe'" | Where-Object { $_.ParentProcessId -eq $trays[0].ProcessId })
        if ((Get-Process -Id $trays[0].ProcessId).MainWindowHandle -ne 0) { Write-Error "the tray has a visible window"; exit 1 }
        Write-Host "link tray pid $($trays[0].ProcessId), console hosts: $($conhosts.Count)"
        $run = (Get-ItemProperty $runKey -Name fairyfly-link -ErrorAction SilentlyContinue).'fairyfly-link'
        if ($run -notlike "*fairyfly-tray.exe*link run --tray*") { Write-Error "Start with Windows not set to the starter: '$run'"; exit 1 }
        if (Test-Path 'HKLM:\Software\DataZoo\fairyfly') { Write-Error "per-user MSI wrote HKLM"; exit 1 }
        & $exe update check
        Write-Host "installed OK: $exe $v"

        $p = Start-Process msiexec.exe -ArgumentList @('/x', "$PWD\build\fairyfly.msi", '/qn', '/l*v', "$PWD\build\msi-uninstall.log") -Wait -PassThru
        if ($p.ExitCode -ne 0) { Write-Error "uninstall failed: $($p.ExitCode)"; exit 1 }
        if (Test-Path $exe) { Write-Error "still present after uninstall"; exit 1 }
        if (Test-Path $lnk) { Write-Error "shortcut still present after uninstall"; exit 1 }
        if (Get-Process -Id $trays[0].ProcessId -ErrorAction SilentlyContinue) { Write-Error "the uninstall did not close the tray"; exit 1 }
        if (Get-ItemProperty $runKey -Name fairyfly-link -ErrorAction SilentlyContinue) { Write-Error "Run value fairyfly-link left behind"; exit 1 }
        if ([Environment]::GetEnvironmentVariable('PATH', 'User') -like "*Programs\fairyfly*") { Write-Error "PATH entry not removed"; exit 1 }
        Write-Host "uninstalled OK"
      shell: pwsh

    - name: Update channel (real GitHub releases, live)
      env:
        FAIRYFLY_GITHUB_TOKEN: ${{ github.token }}
      run: '& "build/Release/unit_tests.exe" "[update-live]"'
      shell: pwsh

    - name: Upload fairyfly.exe artifact
      uses: actions/upload-artifact@v4
      with:
        name: fairyfly-windows-x64
        path: |
          build/Release/fairyfly.exe
          build/fairyfly.msi
        retention-days: 90
        if-no-files-found: error

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: build/test-results.xml
        retention-days: 30

  # The Microsoft Store configuration (FAIRYFLY_PACKAGE=msix, docs/MSIX.md): builds and runs the unit tests (the
  # [msix-build] cases check this build's wiring), checks the real fairyfly.exe answers `update` with the Store's code and
  # the rendered AppxManifest.xml parses. No MakeAppx, no signing, no secrets. Runs beside build-windows (same vcpkg
  # cache), so the wall time stays the same; it costs a second Windows runner.
  build-windows-msix:
    timeout-minutes: 40
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        git checkout ${{ env.VCPKG_COMMIT }}
        .\bootstrap-vcpkg.bat
      shell: pwsh

    - name: Cache vcpkg (comprehensive)
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg_installed
          ${{ github.workspace }}/vcpkg/packages
          ${{ github.workspace }}/vcpkg/buildtrees
          ${{ github.workspace }}/vcpkg/downloads
        key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-
          vcpkg-${{ runner.os }}-

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure and build (FAIRYFLY_PACKAGE=msix)
      run: |
        $env:VCPKG_ROOT = "${{ github.workspace }}/vcpkg"
        cmake -B build-msix `
          -G "Visual Studio 17 2022" `
          -DVCPKG_TARGET_TRIPLET=x64-windows-static `
          -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
          -DFAIRYFLY_PACKAGE=msix
        if ($LASTEXITCODE -ne 0) { exit 1 }
        cmake --build build-msix --config Release --target fairyfly unit_tests --parallel
        if ($LASTEXITCODE -ne 0) { exit 1 }
      shell: pwsh

    - name: Run unit tests (msix build)
      run: |
        & "build-msix/Release/unit_tests.exe" "~[!mayfail]" --reporter junit --out build-msix/test-results.xml
        if ($LASTEXITCODE -ne 0) { exit 1 }
      shell: pwsh

    - name: The msix fairyfly.exe leaves updates to the Store; its manifest parses
      run: |
        $out = (& build-msix/Release/fairyfly.exe --no-audit update check 2>&1 | Out-String)
        Write-Host $out
        if ($LASTEXITCODE -eq 0 -or $out -notmatch 'UPDATE_MANAGED_BY_STORE') { Write-Error "update check did not answer UPDATE_MANAGED_BY_STORE"; exit 1 }
        $out = (& build-msix/Release/fairyfly.exe --no-audit update apply 2>&1 | Out-String)
        if ($LASTEXITCODE -eq 0 -or $out -notmatch 'UPDATE_MANAGED_BY_STORE') { Write-Error "update apply did not answer UPDATE_MANAGED_BY_STORE: $out"; exit 1 }
        $manifest = [xml](Get-Content build-msix/msix/AppxManifest.xml -Raw)
        $id = $manifest.Package.Identity
        Write-Host "AppxManifest.xml: $($id.Name) $($id.Version) ($($id.Publisher))"
        if ($id.Version -ne (& ./packaging/msix_version.ps1).Trim()) { Write-Error "manifest version $($id.Version) differs from msix_version.ps1"; exit 1 }
        exit 0   # not the exit code of `update apply` above (the expected refusal)
      shell: pwsh

    - name: Upload msix test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-msix
        path: build-msix/test-results.xml
        retention-days: 30

  # The MSIX manifest template as CMake renders it (packaging/msix/tests/Test-AppxManifest.ps1) and the layout staging
  # with the MSI payload and the logo assets (packaging/msix/tests/Test-MsixLayout.ps1): pwsh and cmake only.
  msix-manifest:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: AppxManifest template checks
      run: ./packaging/msix/tests/Test-AppxManifest.ps1
      shell: pwsh
    - name: MSIX layout checks (payload = the MSI's, logo assets)
      run: ./packaging/msix/tests/Test-MsixLayout.ps1
      shell: pwsh
