name: Build fairyfly

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

env:
  VCPKG_COMMIT: 29ff5b8131d0c6c8fcb8fbaef35992f0d507cd7c

jobs:
  build-windows:
    # Pinned: windows-latest moved to an image without Visual Studio 2022, so the
    # "Visual Studio 17 2022" CMake generator below could not find any instance (2026-09-29).
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        git checkout ${{ env.VCPKG_COMMIT }}
        .\bootstrap-vcpkg.bat
      shell: pwsh

    - name: Cache vcpkg (comprehensive)
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg_installed
          ${{ github.workspace }}/vcpkg/packages
          ${{ github.workspace }}/vcpkg/buildtrees
          ${{ github.workspace }}/vcpkg/downloads
        key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-
          vcpkg-${{ runner.os }}-

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set VCPKG_ROOT environment variable
      run: |
        echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $env:GITHUB_ENV
        echo "VCPKG_ROOT set to: ${{ github.workspace }}/vcpkg"
      shell: pwsh

    - name: Configure and Build (Makefile-style)
      run: |
        Write-Host "Configuring CMake for Release build..."
        cmake -B build `
          -G "Visual Studio 17 2022" `
          -DVCPKG_TARGET_TRIPLET=x64-windows-static `
          -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"

        Write-Host "`nBuilding project in Release mode..."
        cmake --build build --config Release --target fairyfly unit_tests --parallel

        Write-Host "`n✓ Build complete. Executable at: build/Release/fairyfly.exe"
      shell: pwsh

    - name: Run unit tests (SAP-free tests only)
      run: |
        Write-Host "Running unit tests (excluding SAP GUI-dependent tests)..."
        # Run tests excluding [!mayfail] tagged tests
        & "build/Release/unit_tests.exe" "~[!mayfail]" --reporter junit --out build/test-results.xml

      shell: pwsh
      continue-on-error: false

    - name: Verify executable
      run: |
        if (Test-Path "build/Release/fairyfly.exe") {
          Write-Host "✓ fairyfly.exe built successfully"
          $size = (Get-Item "build/Release/fairyfly.exe").Length / 1MB
          Write-Host "  Size: $([math]::Round($size, 2)) MB"

          # Test executable runs
          Write-Host "`nTesting executable..."
          & "build/Release/fairyfly.exe" --version
          & "build/Release/fairyfly.exe" --help

          # Code signing metadata (SignPath Foundation): product name = project name, product version = fairyfly --version
          $info = (Get-Item "build/Release/fairyfly.exe").VersionInfo
          $reported = (& "build/Release/fairyfly.exe" --version | Out-String).Trim()
          if ($info.ProductName -ne "fairyfly") { Write-Error "ProductName is '$($info.ProductName)', expected 'fairyfly'"; exit 1 }
          if ($info.ProductVersion -ne $reported) { Write-Error "ProductVersion '$($info.ProductVersion)' differs from --version '$reported'"; exit 1 }
          Write-Host "  Version info OK: $($info.ProductName) $($info.ProductVersion)"
        } else {
          Write-Error "fairyfly.exe not found!"
          exit 1
        }
      shell: pwsh

    - name: Upload fairyfly.exe artifact
      uses: actions/upload-artifact@v4
      with:
        name: fairyfly-windows-x64
        path: build/Release/fairyfly.exe
        retention-days: 90
        if-no-files-found: error

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: build/test-results.xml
        retention-days: 30
