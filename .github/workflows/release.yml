name: Release fairyfly

# Builds fairyfly.exe from the tagged source on a GitHub-hosted runner, optionally signs it with Azure Artifact
# Signing (see docs/SIGNING.md) and publishes it with the per-user MSI, the winget manifests of DataZoo.fairyfly
# (packaging/winget/) and SHA256SUMS.
# Tag format: vYYYY.MM.DD, or vYYYY.MM.DD.N (N >= 1) for a further release on the same day, e.g. v2026.10.24.1
# (calendar version = ProductVersion of fairyfly.exe = `fairyfly --version`). Without the Azure signing secrets
# the release is published unsigned.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (vYYYY.MM.DD or vYYYY.MM.DD.N)'
        required: true

env:
  VCPKG_COMMIT: 29ff5b8131d0c6c8fcb8fbaef35992f0d507cd7c
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 90
    runs-on: windows-2022
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      signing: ${{ steps.cfg.outputs.signing }}
    env:
      AZURE_SIGNING_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
    steps:
    - name: Checkout the tagged source
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        git checkout ${{ env.VCPKG_COMMIT }}
        .\bootstrap-vcpkg.bat
      shell: pwsh

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build (Release, static)
      run: |
        $env:VCPKG_ROOT = "${{ github.workspace }}/vcpkg"
        cmake -B build -G "Visual Studio 17 2022" -DVCPKG_TARGET_TRIPLET=x64-windows-static `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
        cmake --build build --config Release --target fairyfly unit_tests --parallel
      shell: pwsh

    - name: Unit tests (SAP-free)
      run: '& "build/Release/unit_tests.exe" "~[!mayfail]"'
      shell: pwsh

    - name: Check version metadata against the tag
      run: |
        $info = (Get-Item "build/Release/fairyfly.exe").VersionInfo
        $reported = (& "build/Release/fairyfly.exe" --version | Out-String).Trim()
        if ($info.ProductName -ne "fairyfly") { Write-Error "ProductName is '$($info.ProductName)'"; exit 1 }
        if ($info.ProductVersion -ne $reported) { Write-Error "ProductVersion '$($info.ProductVersion)' differs from --version '$reported'"; exit 1 }
        $tag = $env:RELEASE_TAG
        if ($tag -notmatch '^v\d{4}\.\d{2}\.\d{2}(?:\.([1-9]\d{0,4}))?$' -or ($Matches[1] -and [int]$Matches[1] -gt 65535)) { Write-Error "Tag '$tag' is not vYYYY.MM.DD or vYYYY.MM.DD.N (N 1..65535)"; exit 1 }
        if ($info.FileVersion -ne $reported) { Write-Error "FileVersion '$($info.FileVersion)' differs from --version '$reported'"; exit 1 }
        $n = if ($reported -match '^\d{4}\.\d{2}\.\d{2}\.(\d+)$') { [int]$Matches[1] } else { 0 }
        if ($info.ProductPrivatePart -ne $n -or $info.FilePrivatePart -ne $n) { Write-Error "the version resource's 4th field is $($info.ProductPrivatePart)/$($info.FilePrivatePart), expected $n for $reported"; exit 1 }
        if ($tag -ne "v$reported") { Write-Error "Tag '$tag' does not match the product version 'v$reported': bump src/include/version.h, CMakeLists.txt and vcpkg.json (packaging/set_version.ps1) before tagging"; exit 1 }
        Write-Host "Release $reported OK"
      shell: pwsh

    - name: Upload unsigned fairyfly.exe and fairyfly-tray.exe
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: fairyfly-unsigned
        # fairyfly-tray.exe (the tray starter) ships in the MSI only
        path: |
          build/Release/fairyfly.exe
          build/Release/fairyfly-tray.exe
        retention-days: 30
        if-no-files-found: error

    - name: Signing configured?
      id: cfg
      run: |
        if ($env:AZURE_SIGNING_CLIENT_SECRET) { "signing=true" >> $env:GITHUB_OUTPUT } else { "signing=false" >> $env:GITHUB_OUTPUT }
      shell: pwsh

  sign:
    needs: build
    if: needs.build.outputs.signing == 'true'
    timeout-minutes: 30
    runs-on: windows-2022
    steps:
    - name: Download the unsigned build
      uses: actions/download-artifact@v4
      with:
        name: fairyfly-unsigned
        path: unsigned

    - name: Sign fairyfly.exe with Azure Artifact Signing
      # Inputs follow the azure/trusted-signing-action documentation (the service was renamed to Artifact Signing);
      # check them against the current action when the Azure account exists.
      uses: azure/trusted-signing-action@v0
      with:
        azure-tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
        azure-client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        files-folder: unsigned
        files-folder-filter: exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Verify the signature
      run: |
        $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like '*\x64\*' } | Sort-Object FullName | Select-Object -Last 1).FullName
        & $signtool verify /pa /v unsigned\fairyfly.exe
        if ($LASTEXITCODE -ne 0) { exit 1 }
        & $signtool verify /pa /v unsigned\fairyfly-tray.exe
      shell: pwsh

    - name: Upload the signed fairyfly.exe and fairyfly-tray.exe
      uses: actions/upload-artifact@v4
      with:
        name: fairyfly-signed
        path: |
          unsigned/fairyfly.exe
          unsigned/fairyfly-tray.exe
        if-no-files-found: error

  package:
    # per-user MSI around the exe that is released (signed when signing is configured); docs/LINK.md, packaging/
    needs: [ build, sign ]
    if: ${{ always() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    timeout-minutes: 30
    runs-on: windows-2022
    steps:
    - name: Checkout the tagged source (packaging/)
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: Download the released fairyfly.exe
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.sign.result == 'success' && 'fairyfly-signed' || 'fairyfly-unsigned' }}
        path: exe

    - name: Build the MSI
      run: |
        dotnet tool install --global wix --version 5.0.2
        $msiVersion = (& ./packaging/msi_version.ps1 -Version "${{ env.RELEASE_TAG }}").Trim()
        New-Item -ItemType Directory -Force msi | Out-Null
        wix build packaging/fairyfly.wxs -arch x64 -d ExePath=exe/fairyfly.exe -d TrayExePath=exe/fairyfly-tray.exe -d MsiVersion=$msiVersion -o msi/fairyfly.msi
        if ($LASTEXITCODE -ne 0) { Write-Error "wix build failed"; exit 1 }
      shell: pwsh

    - name: Sign the MSI with Azure Artifact Signing
      if: needs.build.outputs.signing == 'true'
      uses: azure/trusted-signing-action@v0
      with:
        azure-tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
        azure-client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        files-folder: msi
        files-folder-filter: msi
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Upload the MSI
      uses: actions/upload-artifact@v4
      with:
        name: fairyfly-msi
        path: msi/fairyfly.msi
        if-no-files-found: error

    - name: Render the winget manifests for the released MSI
      # after signing: InstallerSha256 must be the hash of the published fairyfly.msi
      run: |
        ./packaging/winget/New-WingetManifest.ps1 -Version "${{ env.RELEASE_TAG }}" -MsiPath msi/fairyfly.msi -OutDir winget
        Get-ChildItem winget | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName }
      shell: pwsh

    - name: Validate the winget manifests
      run: |
        $winget = Get-Command winget -ErrorAction SilentlyContinue
        if (-not $winget) { Write-Host "::warning::winget is not on this runner image; manifests not validated here (winget.yml validates them on every packaging PR)"; exit 0 }
        & $winget.Source validate --manifest winget --disable-interactivity
        if ($LASTEXITCODE -ne 0) { Write-Error "winget validate failed: $LASTEXITCODE"; exit 1 }
      shell: pwsh

    - name: Upload the winget manifests
      uses: actions/upload-artifact@v4
      with:
        name: fairyfly-winget
        path: winget/*.yaml
        if-no-files-found: error

  release:
    needs: [ build, sign, package ]
    # run when signing succeeded or was not configured (unsigned release); never when signing was requested and failed
    if: ${{ always() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') && needs.package.result == 'success' }}
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download the signed build (or the unsigned one)
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.sign.result == 'success' && 'fairyfly-signed' || 'fairyfly-unsigned' }}
        path: dist

    - name: Download the MSI
      uses: actions/download-artifact@v4
      with:
        name: fairyfly-msi
        path: dist

    - name: Download the winget manifests
      uses: actions/download-artifact@v4
      with:
        name: fairyfly-winget
        path: dist

    - name: Checksums and release
      env:
        GH_TOKEN: ${{ github.token }}
        SIGNED: ${{ needs.sign.result == 'success' }}
      run: |
        cd dist
        sha256sum fairyfly.exe fairyfly.msi DataZoo.fairyfly*.yaml > SHA256SUMS
        cat SHA256SUMS
        if [ "$SIGNED" = "true" ]; then SIGNNOTE="Authenticode-signed (Azure Artifact Signing)."; else SIGNNOTE="Not code-signed."; fi
        NOTES="fairyfly ${RELEASE_TAG#v} - Windows x64: fairyfly.exe (portable), fairyfly.msi (per-user installer, no admin rights) and the winget manifests DataZoo.fairyfly*.yaml (put the three files in one folder, then: winget install --manifest <folder>). ${SIGNNOTE} See the README (Install, Code signing policy)."
        gh release create "$RELEASE_TAG" fairyfly.exe fairyfly.msi DataZoo.fairyfly.yaml DataZoo.fairyfly.installer.yaml DataZoo.fairyfly.locale.en-US.yaml SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "fairyfly ${RELEASE_TAG#v}" --notes "$NOTES"

  winget-pkgs:
    # OFF by default. Opens a pull request for DataZoo.fairyfly in microsoft/winget-pkgs from the published release.
    # Enable only with the maintainers' explicit OK: repository variable WINGET_PKGS_SUBMIT=true and secret
    # WINGET_PKGS_TOKEN (classic PAT with public_repo of the account whose fork of winget-pkgs is used).
    needs: release
    if: ${{ vars.WINGET_PKGS_SUBMIT == 'true' }}
    timeout-minutes: 20
    runs-on: windows-2022
    steps:
    - name: Download the manifests of the published release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $version = "${{ env.RELEASE_TAG }}".TrimStart('v')
        $dir = "manifests/d/DataZoo/fairyfly/$version"
        New-Item -ItemType Directory -Force $dir | Out-Null
        gh release download "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" --pattern 'DataZoo.fairyfly*.yaml' --dir $dir
        Get-ChildItem $dir
      shell: pwsh

    - name: Submit to microsoft/winget-pkgs (wingetcreate)
      env:
        WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
      run: |
        if (-not $env:WINGET_PKGS_TOKEN) { Write-Error "WINGET_PKGS_TOKEN is not set"; exit 1 }
        Invoke-WebRequest https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe -OutFile wingetcreate.exe
        $version = "${{ env.RELEASE_TAG }}".TrimStart('v')
        ./wingetcreate.exe submit --token $env:WINGET_PKGS_TOKEN --prtitle "New version: DataZoo.fairyfly version $version" "manifests/d/DataZoo/fairyfly/$version"
        if ($LASTEXITCODE -ne 0) { Write-Error "wingetcreate submit failed: $LASTEXITCODE"; exit 1 }
      shell: pwsh
