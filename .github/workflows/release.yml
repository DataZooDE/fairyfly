name: Release fairyfly

# Builds fairyfly.exe from the tagged source on a GitHub-hosted runner, optionally signs it with Azure Artifact
# Signing (see docs/SIGNING.md) and publishes it with SHA256SUMS.
# Tag format: vYYYY.MM.DD (calendar version = ProductVersion of fairyfly.exe). Without the Azure signing secrets
# the release is published unsigned.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (vYYYY.MM.DD)'
        required: true

env:
  VCPKG_COMMIT: 29ff5b8131d0c6c8fcb8fbaef35992f0d507cd7c
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 90
    runs-on: windows-2022
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      signing: ${{ steps.cfg.outputs.signing }}
    env:
      AZURE_SIGNING_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
    steps:
    - name: Checkout the tagged source
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        git checkout ${{ env.VCPKG_COMMIT }}
        .\bootstrap-vcpkg.bat
      shell: pwsh

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build (Release, static)
      run: |
        $env:VCPKG_ROOT = "${{ github.workspace }}/vcpkg"
        cmake -B build -G "Visual Studio 17 2022" -DVCPKG_TARGET_TRIPLET=x64-windows-static `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
        cmake --build build --config Release --target fairyfly unit_tests --parallel
      shell: pwsh

    - name: Unit tests (SAP-free)
      run: '& "build/Release/unit_tests.exe" "~[!mayfail]"'
      shell: pwsh

    - name: Check version metadata against the tag
      run: |
        $info = (Get-Item "build/Release/fairyfly.exe").VersionInfo
        $reported = (& "build/Release/fairyfly.exe" --version | Out-String).Trim()
        if ($info.ProductName -ne "fairyfly") { Write-Error "ProductName is '$($info.ProductName)'"; exit 1 }
        if ($info.ProductVersion -ne $reported) { Write-Error "ProductVersion '$($info.ProductVersion)' differs from --version '$reported'"; exit 1 }
        if ("${{ env.RELEASE_TAG }}" -ne "v$reported") { Write-Error "Tag '${{ env.RELEASE_TAG }}' does not match the product version 'v$reported': bump src/include/version.h, CMakeLists.txt and vcpkg.json before tagging"; exit 1 }
        Write-Host "Release $reported OK"
      shell: pwsh

    - name: Upload unsigned fairyfly.exe
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: fairyfly-unsigned
        path: build/Release/fairyfly.exe
        retention-days: 30
        if-no-files-found: error

    - name: Signing configured?
      id: cfg
      run: |
        if ($env:AZURE_SIGNING_CLIENT_SECRET) { "signing=true" >> $env:GITHUB_OUTPUT } else { "signing=false" >> $env:GITHUB_OUTPUT }
      shell: pwsh

  sign:
    needs: build
    if: needs.build.outputs.signing == 'true'
    timeout-minutes: 30
    runs-on: windows-2022
    steps:
    - name: Download the unsigned build
      uses: actions/download-artifact@v4
      with:
        name: fairyfly-unsigned
        path: unsigned

    - name: Sign fairyfly.exe with Azure Artifact Signing
      # Inputs follow the azure/trusted-signing-action documentation (the service was renamed to Artifact Signing);
      # check them against the current action when the Azure account exists.
      uses: azure/trusted-signing-action@v0
      with:
        azure-tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
        azure-client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        files-folder: unsigned
        files-folder-filter: exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Verify the signature
      run: |
        $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like '*\x64\*' } | Sort-Object FullName | Select-Object -Last 1).FullName
        & $signtool verify /pa /v unsigned\fairyfly.exe
      shell: pwsh

    - name: Upload the signed fairyfly.exe
      uses: actions/upload-artifact@v4
      with:
        name: fairyfly-signed
        path: unsigned/fairyfly.exe
        if-no-files-found: error

  release:
    needs: [ build, sign ]
    # run when signing succeeded or was not configured (unsigned release); never when signing was requested and failed
    if: ${{ always() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download the signed build (or the unsigned one)
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.sign.result == 'success' && 'fairyfly-signed' || 'fairyfly-unsigned' }}
        path: dist

    - name: Checksums and release
      env:
        GH_TOKEN: ${{ github.token }}
        SIGNED: ${{ needs.sign.result == 'success' }}
      run: |
        cd dist
        sha256sum fairyfly.exe > SHA256SUMS
        cat SHA256SUMS
        if [ "$SIGNED" = "true" ]; then SIGNNOTE="Authenticode-signed (Azure Artifact Signing)."; else SIGNNOTE="Not code-signed."; fi
        NOTES="fairyfly ${RELEASE_TAG#v} - Windows x64. ${SIGNNOTE} See the README (Code signing policy) for how to verify."
        gh release create "$RELEASE_TAG" fairyfly.exe SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "fairyfly ${RELEASE_TAG#v}" --notes "$NOTES"
