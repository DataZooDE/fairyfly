name: Release fairyfly

# Builds fairyfly.exe from the tagged source on a GitHub-hosted runner, signs it with Microsoft Artifact Signing when
# that is configured (docs/SIGNING.md) and publishes it with the per-user MSI, the winget manifests of DataZoo.fairyfly
# (packaging/winget/), the unsigned Microsoft Store package fairyfly-<msixversion>.msix (job build-msix, FAIRYFLY_PACKAGE=msix;
# the Store signs it, docs/MSIX.md) and SHA256SUMS.
# Tag format: vYYYY.MM.DD, or vYYYY.MM.DD.N (N >= 1) for a further release on the same day, e.g. v2026.10.24.1
# (calendar version = ProductVersion of fairyfly.exe = `fairyfly --version`).
# Signing is configured when the repository variable AZURE_SIGNING_ACCOUNT is set (all AZURE_SIGNING_* variables are
# then required; no secret: OIDC through the environment `release-signing`). The sign job then signs every exe, builds
# the MSI around the signed exes, signs the MSI (RFC 3161 time stamps) and checks each file with
# packaging/sign/Test-Signature.ps1 (valid, trusted chain, time stamp, signer = the updater pin O=DataZoo GmbH, C=DE).
# SHA256SUMS and the winget manifests hash the signed files. Without AZURE_SIGNING_ACCOUNT the release is unsigned,
# unless REQUIRE_SIGNING is 'true', which fails it.
# Supply chain: a release is always the commit of the tag the run is on (github.ref = refs/tags/<tag>, checked by the
# build and sign jobs; every checkout is github.sha; no tag input), every action is pinned to a commit SHA, and WiX
# is installed from a SHA-512-pinned package before azure/login (packaging/sign/tests/Test-ReleaseWorkflow.ps1).

on:
  push:
    tags: [ 'v*' ]
  # a manual run must be started ON the tag: gh workflow run release.yml --ref vYYYY.MM.DD (no tag input: the release
  # is always the commit github.ref points to, which the environment release-signing and the guard below check)
  workflow_dispatch:

env:
  VCPKG_COMMIT: 29ff5b8131d0c6c8fcb8fbaef35992f0d507cd7c
  RELEASE_TAG: ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 90
    runs-on: windows-2022
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      signing: ${{ steps.cfg.outputs.signing }}
    steps:
    - name: Release ref guard
      # only a tag run releases: github.ref must be refs/tags/<RELEASE_TAG> (also for workflow_dispatch)
      env:
        REF: ${{ github.ref }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        if ($env:REF_TYPE -ne 'tag' -or $env:REF -cne "refs/tags/$env:RELEASE_TAG" -or $env:RELEASE_TAG -cnotmatch '^v\d{4}\.\d{2}\.\d{2}(\.[1-9]\d{0,4})?$') {
          Write-Error "release.yml runs only on a release tag vYYYY.MM.DD[.N]; github.ref is '$env:REF' ($env:REF_TYPE)"; exit 1
        }
      shell: pwsh

    - name: Signing configured?
      # from repository variables (OIDC needs no secret); a partial configuration fails instead of shipping unsigned
      id: cfg
      env:
        AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        AZURE_SIGNING_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
        AZURE_SIGNING_TENANT_ID: ${{ vars.AZURE_SIGNING_TENANT_ID }}
        AZURE_SIGNING_SUBSCRIPTION_ID: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}
        REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING }}
      run: |
        if ($env:AZURE_SIGNING_ACCOUNT) {
          $missing = @('AZURE_SIGNING_PROFILE', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_CLIENT_ID', 'AZURE_SIGNING_TENANT_ID', 'AZURE_SIGNING_SUBSCRIPTION_ID') |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) { Write-Error "AZURE_SIGNING_ACCOUNT is set, but these repository variables are empty: $($missing -join ', ') (docs/SIGNING.md)"; exit 1 }
          Write-Host "signing with Artifact Signing account $env:AZURE_SIGNING_ACCOUNT, profile $env:AZURE_SIGNING_PROFILE"
          "signing=true" >> $env:GITHUB_OUTPUT
        } elseif ($env:REQUIRE_SIGNING -eq 'true') {
          Write-Error "REQUIRE_SIGNING is 'true' but AZURE_SIGNING_ACCOUNT is empty: refusing an unsigned release"; exit 1
        } else {
          Write-Host "::notice::signing is not configured (AZURE_SIGNING_ACCOUNT is empty): this release is unsigned"
          "signing=false" >> $env:GITHUB_OUTPUT
        }
      shell: pwsh

    - name: Checkout the tagged source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        ref: ${{ github.sha }}

    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        git checkout ${{ env.VCPKG_COMMIT }}
        .\bootstrap-vcpkg.bat
      shell: pwsh

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      with:
        arch: x64

    - name: Build (Release, static)
      run: |
        $env:VCPKG_ROOT = "${{ github.workspace }}/vcpkg"
        cmake -B build -G "Visual Studio 17 2022" -DVCPKG_TARGET_TRIPLET=x64-windows-static `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
        cmake --build build --config Release --target fairyfly unit_tests --parallel
      shell: pwsh

    - name: Unit tests (SAP-free)
      run: '& "build/Release/unit_tests.exe" "~[!mayfail]"'
      shell: pwsh

    - name: Check version metadata against the tag
      run: |
        $info = (Get-Item "build/Release/fairyfly.exe").VersionInfo
        $reported = (& "build/Release/fairyfly.exe" --version | Out-String).Trim()
        if ($info.ProductName -ne "fairyfly") { Write-Error "ProductName is '$($info.ProductName)'"; exit 1 }
        if ($info.ProductVersion -ne $reported) { Write-Error "ProductVersion '$($info.ProductVersion)' differs from --version '$reported'"; exit 1 }
        $tag = $env:RELEASE_TAG
        if ($info.FileVersion -ne $reported) { Write-Error "FileVersion '$($info.FileVersion)' differs from --version '$reported'"; exit 1 }
        $n = if ($reported -match '^\d{4}\.\d{2}\.\d{2}\.(\d+)$') { [int]$Matches[1] } else { 0 }
        if ($info.ProductPrivatePart -ne $n -or $info.FilePrivatePart -ne $n) { Write-Error "the version resource's 4th field is $($info.ProductPrivatePart)/$($info.FilePrivatePart), expected $n for $reported"; exit 1 }
        # vYYYY.MM.DD[.N] with a lowercase v (what the updater's parse_release takes) and equal to v<--version>
        try { & ./packaging/check_release_tag.ps1 -Tag $tag -Version $reported } catch { Write-Error $_.Exception.Message; exit 1 }
        Write-Host "Release $reported OK"
      shell: pwsh

    - name: Upload unsigned fairyfly.exe and fairyfly-tray.exe
      id: upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: fairyfly-unsigned
        # fairyfly-tray.exe (the tray starter) ships in the MSI only
        path: |
          build/Release/fairyfly.exe
          build/Release/fairyfly-tray.exe
        retention-days: 30
        if-no-files-found: error

  build-msix:
    # The Microsoft Store package (FAIRYFLY_PACKAGE=msix, docs/MSIX.md) from the tagged commit: build, unit tests, the
    # version checks (fairyfly.exe --version = the tag; the package version = msix_version.ps1 of the tag and above the
    # MSIX version of every earlier release, packaging/check_msix_version.ps1), then the UNSIGNED
    # fairyfly-<msixversion>.msix (packaging/msix/New-MsixPackage.ps1, as build.yml). The Store signs what is submitted:
    # no environment, no Azure login, no signtool, never a test-signed copy or a certificate.
    timeout-minutes: 90
    runs-on: windows-2022
    outputs:
      msix-version: ${{ steps.pack.outputs.version }}
      msix-sha256: ${{ steps.msix-hash.outputs.sha256 }}
    steps:
    - name: Release ref guard
      # only a tag run releases: github.ref must be refs/tags/<RELEASE_TAG> (also for workflow_dispatch)
      env:
        REF: ${{ github.ref }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        if ($env:REF_TYPE -ne 'tag' -or $env:REF -cne "refs/tags/$env:RELEASE_TAG" -or $env:RELEASE_TAG -cnotmatch '^v\d{4}\.\d{2}\.\d{2}(\.[1-9]\d{0,4})?$') {
          Write-Error "release.yml runs only on a release tag vYYYY.MM.DD[.N]; github.ref is '$env:REF' ($env:REF_TYPE)"; exit 1
        }
      shell: pwsh

    - name: Checkout the tagged source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        git checkout ${{ env.VCPKG_COMMIT }}
        .\bootstrap-vcpkg.bat
      shell: pwsh

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      with:
        arch: x64

    - name: Build (Release, static, FAIRYFLY_PACKAGE=msix)
      run: |
        $env:VCPKG_ROOT = "${{ github.workspace }}/vcpkg"
        cmake -B build-msix -G "Visual Studio 17 2022" -DVCPKG_TARGET_TRIPLET=x64-windows-static `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DFAIRYFLY_PACKAGE=msix
        if ($LASTEXITCODE -ne 0) { exit 1 }
        cmake --build build-msix --config Release --target fairyfly unit_tests --parallel
        if ($LASTEXITCODE -ne 0) { exit 1 }
      shell: pwsh

    - name: Unit tests (SAP-free, msix build)
      run: |
        & "build-msix/Release/unit_tests.exe" "~[!mayfail]"
        if ($LASTEXITCODE -ne 0) { exit 1 }
      shell: pwsh

    - name: Check the msix fairyfly.exe against the tag
      run: |
        $reported = (& "build-msix/Release/fairyfly.exe" --version | Out-String).Trim()
        try { & ./packaging/check_release_tag.ps1 -Tag $env:RELEASE_TAG -Version $reported } catch { Write-Error $_.Exception.Message; exit 1 }
        $out = (& build-msix/Release/fairyfly.exe --no-audit update check 2>&1 | Out-String)
        if ($LASTEXITCODE -eq 0 -or $out -notmatch 'UPDATE_MANAGED_BY_STORE') { Write-Error "the msix fairyfly.exe does not leave updates to the Store: $out"; exit 1 }
        Write-Host "msix fairyfly.exe $reported OK"
        exit 0   # not the exit code of `update check` above (the expected refusal)
      shell: pwsh

    - name: Pack the unsigned MSIX (packaging/msix/New-MsixPackage.ps1)
      id: pack
      run: |
        $pkg = ./packaging/msix/New-MsixPackage.ps1 -BinDir build-msix/Release -Manifest build-msix/msix/AppxManifest.xml -WorkDir build-msix
        "version=$($pkg.Version)" >> $env:GITHUB_OUTPUT
        "MSIX_PATH=$($pkg.Path)" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Check the MSIX version against the tag and the earlier releases; the package is unsigned
      # the Store refuses a package version that is not above the last submitted one: the release fails here instead
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $previous = @(gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft | not) | .tag_name')
        if ($LASTEXITCODE -ne 0) { Write-Error "listing the releases failed ($LASTEXITCODE)"; exit 1 }
        Write-Host "published releases: $($previous -join ', ')"
        $packed = ([xml](Get-Content build-msix/unpacked/AppxManifest.xml -Raw)).Package.Identity.Version
        try { & ./packaging/check_msix_version.ps1 -Tag $env:RELEASE_TAG -MsixVersion $packed -PreviousTags $previous } catch { Write-Error $_.Exception.Message; exit 1 }
        if ((Split-Path $env:MSIX_PATH -Leaf) -cne "fairyfly-$packed.msix") { Write-Error "unexpected package name $env:MSIX_PATH"; exit 1 }
        $sig = Get-AuthenticodeSignature $env:MSIX_PATH
        if ($sig.Status -ne 'NotSigned') { Write-Error "$env:MSIX_PATH is not unsigned: $($sig.Status)"; exit 1 }
      shell: pwsh

    - name: Hash of the checked MSIX (the release job checks the attached file against it)
      id: msix-hash
      run: |
        "sha256=$((Get-FileHash $env:MSIX_PATH -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Upload the unsigned MSIX
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: fairyfly-msix
        path: build-msix/out/fairyfly-${{ steps.pack.outputs.version }}.msix
        retention-days: 30
        if-no-files-found: error

  sign:
    # Signs fairyfly.exe and fairyfly-tray.exe (every exe of the build), builds the MSI around them and signs it, in
    # one job so that the environment `release-signing` (deployment rule: tags v*) is entered once per release.
    needs: build
    if: needs.build.outputs.signing == 'true'
    timeout-minutes: 30
    runs-on: windows-2022
    environment: release-signing
    permissions:
      contents: read
      id-token: write   # OIDC token for azure/login; Entra federated credential repo:DataZooDE/fairyfly:environment:release-signing
    outputs:
      exe-sha256: ${{ steps.hashes.outputs.exe }}
      msi-sha256: ${{ steps.hashes.outputs.msi }}
    steps:
    - name: Release ref guard
      # only a tag run releases: github.ref must be refs/tags/<RELEASE_TAG> (also for workflow_dispatch)
      env:
        REF: ${{ github.ref }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        if ($env:REF_TYPE -ne 'tag' -or $env:REF -cne "refs/tags/$env:RELEASE_TAG" -or $env:RELEASE_TAG -cnotmatch '^v\d{4}\.\d{2}\.\d{2}(\.[1-9]\d{0,4})?$') {
          Write-Error "release.yml runs only on a release tag vYYYY.MM.DD[.N]; github.ref is '$env:REF' ($env:REF_TYPE)"; exit 1
        }
      shell: pwsh

    - name: Checkout the tagged source (packaging/, CMakeLists.txt for the signer pin)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Install WiX (SHA-512 verified; before azure/login)
      run: ./packaging/sign/Install-Wix.ps1
      shell: pwsh

    - name: Download the unsigned build
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
      with:
        name: fairyfly-unsigned
        path: exe

    - name: Azure login (OIDC, no secret)
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
      with:
        client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}

    - name: Sign fairyfly.exe and fairyfly-tray.exe (Artifact Signing)
      uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
      with:
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        # every exe the build produced, so a new shipped exe cannot stay unsigned
        files-folder: ${{ github.workspace }}\exe
        files-folder-filter: exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
        description: fairyfly
        description-url: https://github.com/DataZooDE/fairyfly
        # only the azure/login session
        exclude-environment-credential: true
        exclude-workload-identity-credential: true
        exclude-managed-identity-credential: true
        exclude-shared-token-cache-credential: true
        exclude-visual-studio-credential: true
        exclude-visual-studio-code-credential: true
        exclude-azure-cli-credential: false
        exclude-azure-powershell-credential: true
        exclude-azure-developer-cli-credential: true
        exclude-interactive-browser-credential: true

    - name: Verify the exe signatures (valid, trusted, time-stamped, signer = updater pin)
      run: |
        $exes = @(Get-ChildItem exe -Filter *.exe | ForEach-Object FullName)
        if ($exes.Count -lt 2) { Write-Error "expected fairyfly.exe and fairyfly-tray.exe, found: $exes"; exit 1 }
        ./packaging/sign/Test-Signature.ps1 -Path $exes
      shell: pwsh

    - name: Build the MSI around the signed exes
      run: |
        $msiVersion = (& ./packaging/msi_version.ps1 -Version "${{ env.RELEASE_TAG }}").Trim()
        New-Item -ItemType Directory -Force msi | Out-Null
        wix build packaging/fairyfly.wxs -arch x64 -d ExePath=exe/fairyfly.exe -d TrayExePath=exe/fairyfly-tray.exe -d MsiVersion=$msiVersion -o msi/fairyfly.msi
        if ($LASTEXITCODE -ne 0) { Write-Error "wix build failed"; exit 1 }
      shell: pwsh

    - name: Sign the MSI (Artifact Signing)
      uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
      with:
        endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
        files: ${{ github.workspace }}\msi\fairyfly.msi
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
        description: fairyfly installer
        description-url: https://github.com/DataZooDE/fairyfly
        exclude-environment-credential: true
        exclude-workload-identity-credential: true
        exclude-managed-identity-credential: true
        exclude-shared-token-cache-credential: true
        exclude-visual-studio-credential: true
        exclude-visual-studio-code-credential: true
        exclude-azure-cli-credential: false
        exclude-azure-powershell-credential: true
        exclude-azure-developer-cli-credential: true
        exclude-interactive-browser-credential: true

    - name: Verify the MSI signature
      run: ./packaging/sign/Test-Signature.ps1 -Path msi/fairyfly.msi
      shell: pwsh

    - name: Hashes of the verified files (the release job checks SHA256SUMS against them)
      id: hashes
      run: |
        "exe=$((Get-FileHash exe/fairyfly.exe -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        "msi=$((Get-FileHash msi/fairyfly.msi -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Upload the signed fairyfly.exe and fairyfly-tray.exe
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: fairyfly-signed
        path: |
          exe/fairyfly.exe
          exe/fairyfly-tray.exe
        if-no-files-found: error

    - name: Upload the signed MSI
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: fairyfly-signed-msi
        path: msi/fairyfly.msi
        if-no-files-found: error

  package:
    # the per-user MSI (docs/LINK.md, packaging/): the signed one from the sign job, or built here around the unsigned
    # exes; then the winget manifests from the MSI that is released
    needs: [ build, sign ]
    if: ${{ always() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    timeout-minutes: 30
    runs-on: windows-2022
    steps:
    - name: Checkout the tagged source (packaging/)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        ref: ${{ github.sha }}

    - name: Download the signed MSI
      if: needs.sign.result == 'success'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
      with:
        name: fairyfly-signed-msi
        path: msi

    - name: Download the unsigned fairyfly.exe and fairyfly-tray.exe
      if: needs.sign.result != 'success'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
      with:
        name: fairyfly-unsigned
        path: exe

    - name: Build the MSI (unsigned release)
      if: needs.sign.result != 'success'
      run: |
        ./packaging/sign/Install-Wix.ps1
        $msiVersion = (& ./packaging/msi_version.ps1 -Version "${{ env.RELEASE_TAG }}").Trim()
        New-Item -ItemType Directory -Force msi | Out-Null
        wix build packaging/fairyfly.wxs -arch x64 -d ExePath=exe/fairyfly.exe -d TrayExePath=exe/fairyfly-tray.exe -d MsiVersion=$msiVersion -o msi/fairyfly.msi
        if ($LASTEXITCODE -ne 0) { Write-Error "wix build failed"; exit 1 }
      shell: pwsh

    - name: Upload the MSI
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: fairyfly-msi
        path: msi/fairyfly.msi
        if-no-files-found: error

    - name: Render the winget manifests for the released MSI
      # from the released MSI (the signed one when signing is configured): InstallerSha256 = hash of the published fairyfly.msi
      run: |
        ./packaging/winget/New-WingetManifest.ps1 -Version "${{ env.RELEASE_TAG }}" -MsiPath msi/fairyfly.msi -OutDir winget
        Get-ChildItem winget | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName }
      shell: pwsh

    - name: Validate the winget manifests
      run: |
        $winget = Get-Command winget -ErrorAction SilentlyContinue
        if (-not $winget) { Write-Host "::warning::winget is not on this runner image; manifests not validated here (winget.yml validates them on every packaging PR)"; exit 0 }
        & $winget.Source validate --manifest winget --disable-interactivity
        if ($LASTEXITCODE -ne 0) { Write-Error "winget validate failed: $LASTEXITCODE"; exit 1 }
      shell: pwsh

    - name: Upload the winget manifests
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: fairyfly-winget
        path: winget/*.yaml
        if-no-files-found: error

  release:
    needs: [ build, build-msix, sign, package ]
    # run when signing succeeded or was not configured (unsigned release); never when signing was requested and failed,
    # nor without the MSIX
    if: ${{ always() && needs.build.result == 'success' && needs.build-msix.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') && needs.package.result == 'success' }}
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download the signed build (or the unsigned one)
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
      with:
        name: ${{ needs.sign.result == 'success' && 'fairyfly-signed' || 'fairyfly-unsigned' }}
        path: dist

    - name: Download the MSI
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
      with:
        name: fairyfly-msi
        path: dist

    - name: Download the winget manifests
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
      with:
        name: fairyfly-winget
        path: dist

    - name: Download the unsigned MSIX (the Store signs it)
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
      with:
        name: fairyfly-msix
        path: dist

    - name: The released MSIX is the one build-msix checked
      env:
        MSIX: fairyfly-${{ needs.build-msix.outputs.msix-version }}.msix
        MSIX_SHA256: ${{ needs.build-msix.outputs.msix-sha256 }}
      run: |
        cd dist
        [ -n "$MSIX_SHA256" ] || { echo "build-msix gave no MSIX hash"; exit 1; }
        echo "$MSIX_SHA256  $MSIX" | sha256sum -c -

    - name: The released files are the verified signed ones
      if: needs.sign.result == 'success'
      env:
        EXE_SHA256: ${{ needs.sign.outputs.exe-sha256 }}
        MSI_SHA256: ${{ needs.sign.outputs.msi-sha256 }}
      run: |
        cd dist
        echo "$EXE_SHA256  fairyfly.exe" | sha256sum -c -
        echo "$MSI_SHA256  fairyfly.msi" | sha256sum -c -
        grep -qi "InstallerSha256: *$MSI_SHA256" DataZoo.fairyfly.installer.yaml || { echo "the winget manifest does not hash the signed MSI"; exit 1; }

    - name: Checksums and release
      env:
        GH_TOKEN: ${{ github.token }}
        SIGNED: ${{ needs.sign.result == 'success' }}
        MSIX: fairyfly-${{ needs.build-msix.outputs.msix-version }}.msix
      run: |
        cd dist
        # exactly the unsigned Store package of build-msix: one .msix, named after its version, nothing else of it
        shopt -s nullglob; packages=( ./*.msix ); shopt -u nullglob
        echo "MSIX packages: ${packages[*]}"
        [ "${#packages[@]}" = "1" ] && [ -f "$MSIX" ] || { echo "expected exactly $MSIX in the release files"; exit 1; }
        sha256sum fairyfly.exe fairyfly.msi "$MSIX" DataZoo.fairyfly*.yaml > SHA256SUMS
        cat SHA256SUMS
        if [ "$SIGNED" = "true" ]; then SIGNNOTE="fairyfly.exe and fairyfly.msi are Authenticode-signed by DataZoo GmbH (Microsoft Artifact Signing)."; else SIGNNOTE="Not code-signed."; fi
        NOTES="fairyfly ${RELEASE_TAG#v} - Windows x64: fairyfly.exe (portable), fairyfly.msi (per-user installer, no admin rights) and the winget manifests DataZoo.fairyfly*.yaml (put the three files in one folder, then: winget install --manifest <folder>). ${SIGNNOTE} ${MSIX} is the unsigned Microsoft Store package (the Store signs it; it does not install by double-click). See the README (Install, Code signing policy)."
        gh release create "$RELEASE_TAG" fairyfly.exe fairyfly.msi "$MSIX" DataZoo.fairyfly.yaml DataZoo.fairyfly.installer.yaml DataZoo.fairyfly.locale.en-US.yaml SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "fairyfly ${RELEASE_TAG#v}" --notes "$NOTES"

  winget-pkgs:
    # OFF by default. Opens a pull request for DataZoo.fairyfly in microsoft/winget-pkgs from the published release.
    # Enable only with the maintainers' explicit OK: repository variable WINGET_PKGS_SUBMIT=true and secret
    # WINGET_PKGS_TOKEN (classic PAT with public_repo of the account whose fork of winget-pkgs is used).
    needs: release
    if: ${{ vars.WINGET_PKGS_SUBMIT == 'true' }}
    timeout-minutes: 20
    runs-on: windows-2022
    steps:
    - name: Download the manifests of the published release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $version = "${{ env.RELEASE_TAG }}".TrimStart('v')
        $dir = "manifests/d/DataZoo/fairyfly/$version"
        New-Item -ItemType Directory -Force $dir | Out-Null
        gh release download "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" --pattern 'DataZoo.fairyfly*.yaml' --dir $dir
        Get-ChildItem $dir
      shell: pwsh

    - name: Submit to microsoft/winget-pkgs (wingetcreate)
      env:
        WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
      run: |
        if (-not $env:WINGET_PKGS_TOKEN) { Write-Error "WINGET_PKGS_TOKEN is not set"; exit 1 }
        Invoke-WebRequest https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe -OutFile wingetcreate.exe
        $version = "${{ env.RELEASE_TAG }}".TrimStart('v')
        ./wingetcreate.exe submit --token $env:WINGET_PKGS_TOKEN --prtitle "New version: DataZoo.fairyfly version $version" "manifests/d/DataZoo/fairyfly/$version"
        if ($LASTEXITCODE -ne 0) { Write-Error "wingetcreate submit failed: $LASTEXITCODE"; exit 1 }
      shell: pwsh
